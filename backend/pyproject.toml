[project]
name = "backend"
version = "0.2.4"
description = "Orbit's local FastAPI backend — capture storage, recall, and session generation. Ships bundled inside the desktop app as a PyInstaller sidecar; not published or run standalone."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.10,<4.0",
    "fastapi>=0.136.3",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.18.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.49.0",
]

[project.urls]
Homepage = "https://heyorbit.saadaan.dev"
Repository = "https://github.com/Saadaan-Hassan/orbit"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyinstaller>=6.22.3",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py314"
# 88 (ruff's default) doesn't match this codebase's existing style — nearly
# all files use denser, longer lines than that. 120 covers all but 15 of the
# ~9,800 lines in the codebase; those remaining are addressed individually
# rather than by reformatting hundreds of pre-existing lines wholesale.
line-length = 120

[tool.ruff.lint]
# Deliberately curated (CI-001) rather than accepting ruff's much broader
# implicit default for this version (which also pulls in bandit-style
# security rules, pylint refactor suggestions, tryceratops, etc.) —  E/F/I/UP/B
# is a widely-used, focused baseline: pycodestyle errors, pyflakes, import
# sorting, pyupgrade (modern syntax), and bugbear (common correctness bugs).
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# scheduler.py's FUSION_SESSION_*_PROMPT_TEMPLATE strings are long by
# necessity (dense per-field instructions to the model) — a trailing #noqa
# isn't usable since these lines are string content, not code, and
# reformatting the prompt text itself is out of scope for a lint pass.
"scheduler.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` as a parameter default is the framework's
# required dependency-injection idiom, not the mutable-default-argument bug
# B008 exists to catch — this is ruff's documented FastAPI allowlist.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

[tool.mypy]
python_version = "3.14"
# check_untyped_defs is intentionally left off (mypy's default) — most test
# helper functions have no type annotations, and forcing that across the
# whole test suite is a separate, much larger undertaking than this pass.

[[tool.mypy.overrides]]
# apscheduler ships no py.typed marker / type stubs (a known upstream gap,
# not something this project controls).
module = "apscheduler.*"
ignore_missing_imports = true
