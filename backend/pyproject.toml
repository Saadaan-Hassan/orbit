[project]
name = "backend"
version = "0.2.4"
description = "Orbit's local FastAPI backend — capture storage, recall, and session generation. Ships bundled inside the desktop app as a PyInstaller sidecar; not published or run standalone."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.10,<4.0",
    "fastapi>=0.136.3",
    "greenlet>=3.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.49.0",
]

[project.urls]
Homepage = "https://heyorbit.saadaan.dev"
Repository = "https://github.com/Saadaan-Hassan/orbit"

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
