[package]
name = "app"
version = "0.2.4"
description = "Orbit — a macOS menu-bar app that turns your activity into searchable memory"
authors = ["Saadaan Hassan"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
regex = "1"
rand = "0.8"
base64 = "0.23"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
notify = "6"
notify-debouncer-full = "0.3"
unicode-normalization = "0.1"
url = "2"
tauri-plugin-global-shortcut = "2.3.2"
# Shell plugin — used in production (release) builds to spawn the bundled
# orbit-backend sidecar binary without requiring uv on the user's machine.
tauri-plugin-shell = "2"

# Desktop-only plugins (not android / ios). tauri-plugin-dialog: native
# folder picker (PrivacyPanel's watched-folders UI). tauri-plugin-process:
# restart_app()'s relaunch(), used by ErrorBoundary's restart button.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2"
accessibility-sys = "0.1"
core-foundation = "0.10"
