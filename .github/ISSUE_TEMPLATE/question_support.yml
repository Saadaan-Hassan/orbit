name: Question / support
description: Install problems, "is this expected?", or a general usage question.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        See `SUPPORT.md` for what's in scope here (no SLA — this is a solo-maintainer project). Check the README's Known Limitations section first; a fair number of "is this expected?" questions are already answered there.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Orbit version (if relevant)
      placeholder: v0.2.4
    validations:
      required: false
