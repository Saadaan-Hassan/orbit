name: CI

# CI-002: real per-workspace verification on every PR, covering the same
# commands documented in CONTRIBUTING.md (CI-001).
#
# Deliberately `pull_request`, never `pull_request_target`: GitHub runs
# `pull_request`-triggered workflows from a fork with a read-only
# GITHUB_TOKEN and withholds repository secrets entirely. None of the jobs
# below need a secret — every command here only reads the checked-out code
# and runs public package-manager installs/checks — so a fork PR gets
# exactly the same access as these jobs need: none.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel a superseded run when the same PR/branch gets a new push — CI
# minutes on an outdated commit aren't worth finishing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, Clippy, tests)
    # macOS runner required: app/src-tauri depends on macOS-only crates
    # (accessibility, accessibility-sys, core-foundation) behind
    # `cfg(target_os = "macos")` for the AXUIElement screen-content capture.
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (tracks the `stable` branch tip — this action has no version tags)
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --bin app

  backend:
    name: Backend (ruff, mypy, unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version-file: backend/.python-version

      - name: Install dependencies
        run: uv sync --all-groups

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy .

      - name: unittest
        run: uv run python -m unittest discover -s tests -p 'test_*.py'

  app:
    name: App (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "11"

      - name: Set up Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  extension:
    name: Extension (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "11"

      - name: Set up Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  worker:
    name: Worker (typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # worker-configuration.d.ts is gitignored (REP-002) — typecheck needs
      # it regenerated first, same as a local clone would.
      - name: Generate Worker types
        run: npx wrangler types

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  landing:
    name: Landing (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "11"

      - name: Set up Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so gitleaks can scan the whole repo, not just the
          # merge commit's snapshot — a secret introduced then removed in an
          # earlier commit of the same PR would otherwise go undetected.
          fetch-depth: 0

      # Installed directly rather than via a marketplace Action: avoids that
      # action's own licensing terms for private-repo use, and a pinned
      # release URL + published checksum is an equally strong (arguably more
      # transparent) integrity guarantee than an Action SHA pin.
      - name: Install gitleaks v8.30.1 (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      # Respects .gitleaksignore at the repo root (already maintained, see
      # REP-001). --redact keeps any matched secret's value out of the log.
      - name: Run gitleaks
        run: ./gitleaks detect --source . --redact --exit-code 1

  dependency-review:
    name: Dependency review
    # Only meaningful on a PR (it diffs the PR's base vs. head dependency
    # manifests) — push-to-main runs have no "other side" to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout step needed — this action reads manifests via the
      # GitHub dependency-graph API using the pull_request event context,
      # not the working tree.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
