name: Publish Extension

# Triggered by pushing an extension-specific version tag — separate from the
# app's `v*` tags (.github/workflows/release.yml) since the extension has its
# own independent release cadence:
#   git tag ext-v0.1.1 && git push origin ext-v0.1.1
#
# PREREQUISITE (one-time, manual — cannot be automated):
#   1. Register as a Chrome Web Store developer (developer.chrome.com/docs/webstore/register,
#      one-time $5 fee).
#   2. Submit the extension ONCE manually through the Chrome Web Store Developer
#      Dashboard (chrome.google.com/webstore/devconsole) as "Unlisted" — first
#      submissions always require human review; there is no API for the very
#      first listing. Note the extension ID the dashboard assigns.
#   3. In Google Cloud Console: enable the "Chrome Web Store API", create an
#      OAuth 2.0 Client ID (type: Desktop app), and generate a refresh token
#      (see developer.chrome.com/docs/webstore/using-api for the one-time
#      authorization-code flow). Add yourself as a test user on the OAuth
#      consent screen or you'll get a 403.
#   4. Add these as secrets on this (private) repo:
#        CHROME_EXTENSION_ID, CHROME_OAUTH_CLIENT_ID,
#        CHROME_OAUTH_CLIENT_SECRET, CHROME_OAUTH_REFRESH_TOKEN
#
# Once that's done, every future update is this one command — Chrome Web
# Store handles rolling it out; installed copies auto-update within a few
# hours, no action needed from beta testers and no manual re-sharing needed
# from you. This is what unpacked/"Load unpacked" distribution can't do —
# Chrome does not auto-update developer-mode extensions, and periodically
# disables them outright as a trust/security measure.
on:
  push:
    tags:
      - "ext-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Build extension
        working-directory: extension
        run: pnpm build

      - name: Zip the built extension
        working-directory: extension
        run: |
          cd dist
          zip -r ../extension.zip . -x "*.map"

      - name: Publish to Chrome Web Store
        uses: browser-actions/release-chrome-extension@latest
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          extension-path: extension/extension.zip
          oauth-client-id: ${{ secrets.CHROME_OAUTH_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.CHROME_OAUTH_CLIENT_SECRET }}
          oauth-refresh-token: ${{ secrets.CHROME_OAUTH_REFRESH_TOKEN }}
