name: Publish Extension

# Triggered by pushing an extension-specific version tag — separate from the
# app's `v*` tags (.github/workflows/release.yml) since the extension has its
# own independent release cadence:
#   git tag ext-v0.1.1 && git push origin ext-v0.1.1
#
# PREREQUISITE (one-time, manual — cannot be automated):
#   1. Register as a Chrome Web Store developer (developer.chrome.com/docs/webstore/register,
#      one-time $5 fee).
#   2. Submit the extension ONCE manually through the Chrome Web Store Developer
#      Dashboard (chrome.google.com/webstore/devconsole) as "Unlisted" — first
#      submissions always require human review; there is no API for the very
#      first listing. Note the extension ID the dashboard assigns.
#   3. In Google Cloud Console: enable the "Chrome Web Store API", create an
#      OAuth 2.0 Client ID (type: Desktop app), and generate a refresh token
#      (see developer.chrome.com/docs/webstore/using-api for the one-time
#      authorization-code flow). Add yourself as a test user on the OAuth
#      consent screen or you'll get a 403.
#   4. Add these as secrets on this (private) repo:
#        CHROME_EXTENSION_ID, CHROME_OAUTH_CLIENT_ID,
#        CHROME_OAUTH_CLIENT_SECRET, CHROME_OAUTH_REFRESH_TOKEN
#
# Once that's done, every future update is this one command — Chrome Web
# Store handles rolling it out; installed copies auto-update within a few
# hours, no action needed from beta testers and no manual re-sharing needed
# from you. This is what unpacked/"Load unpacked" distribution can't do —
# Chrome does not auto-update developer-mode extensions, and periodically
# disables them outright as a trust/security measure.
on:
  push:
    tags:
      - "ext-v*"

# This workflow never writes to this repo (no release/commit created here —
# publishing goes to the Chrome Web Store via its own OAuth secrets below),
# so it needs no more than read access to check out the code (CI-002).
permissions:
  contents: read

# Queue rather than cancel (CI-002), matching release.yml: a re-push of the
# same tag mid-publish should wait, not cancel a submission partway through.
concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "11"

      - name: Set up Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          # zizmor flags this as a possible cache-poisoning vector (REL-001)
          # since this workflow publishes a runtime artifact — reviewed and
          # accepted: this cache's scope is only ever written by this exact
          # tag-push-triggered workflow, which no fork/PR-triggered workflow
          # in this repo shares.
          cache: "pnpm"
          cache-dependency-path: extension/pnpm-lock.yaml

      # REL-001: fail before publishing anywhere if the pushed tag doesn't
      # match manifest.json's version — the Web Store rejects a re-upload at
      # an unchanged version number anyway, but this catches a mismatched
      # (not just unchanged) bump before spending an OAuth-authenticated
      # publish attempt on it.
      - name: Check tag matches manifest.json's version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ext-v}"
          MANIFEST_VERSION=$(grep -m1 '"version"' extension/manifest.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          echo "Tag: $GITHUB_REF_NAME (version $TAG_VERSION) — manifest.json: $MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match extension/manifest.json's version ($MANIFEST_VERSION)."
            echo "Bump manifest.json (and run scripts/check-versions.sh) before tagging."
            exit 1
          fi

      - name: Install dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Build extension
        working-directory: extension
        run: pnpm build

      - name: Zip the built extension
        working-directory: extension
        run: |
          cd dist
          zip -r ../extension.zip . -x "*.map"

      - name: Publish to Chrome Web Store
        uses: browser-actions/release-chrome-extension@9ab2031b37a2f26bf92dab4a2225d686010c2f5e # v0.2.1
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          extension-path: extension/extension.zip
          oauth-client-id: ${{ secrets.CHROME_OAUTH_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.CHROME_OAUTH_CLIENT_SECRET }}
          oauth-refresh-token: ${{ secrets.CHROME_OAUTH_REFRESH_TOKEN }}
