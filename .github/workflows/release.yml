name: Release

# Triggered by pushing a version tag:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*"

# Allow the workflow to create GitHub Releases and upload assets.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Build a signed .dmg and publish it as a GitHub Release.
  #
  # tauri-apps/tauri-action handles two things in one step:
  #   1. Runs `pnpm tauri build` inside app/
  #   2. Creates (or updates) the GitHub Release and uploads .dmg + updater
  #      .tar.gz / .sig / latest.json artefacts as release assets
  #
  # The in-app updater endpoint points at the GitHub Release asset URL
  # (releases/latest/download/latest.json), so no extra commit step is needed —
  # the asset is always served from the latest release automatically.
  # ---------------------------------------------------------------------------
  build-and-release:
    # Two legs, one per Mac architecture. Sequential (max-parallel: 1) rather
    # than parallel — both legs upload a same-named `latest.json` release
    # asset via tauri-action, and running them one at a time lets each leg's
    # "capture what I just uploaded" step below run without a race against
    # the other leg overwriting it first. Slower, but correct — this can't be
    # verified without a real CI run, so race-free trumps race-fast here.
    strategy:
      max-parallel: 1
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (M-series)
            arch: aarch64
          - runner: macos-15-intel     # Intel — macos-13 was retired Dec 2025;
            arch: x86_64                # this is the current GitHub-hosted x86_64 label
    runs-on: ${{ matrix.runner }}
    environment: dev

    steps:
      - uses: actions/checkout@v4

      # ── Rust ───────────────────────────────────────────────────────────────
      # dtolnay/rust-toolchain pins an explicit version and sets up caching
      # properly — more reliable than the pre-installed toolchain on the runner.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Cache key includes matrix.arch — both legs build into the same
      # app/src-tauri/target path (Rust defaults to the host triple, no
      # explicit --target is passed), so an unscoped key would let one
      # architecture's cached build artifacts corrupt the other's.
      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      # ── Node + pnpm ────────────────────────────────────────────────────────
      # Pin pnpm to match the major version used locally (11.x) so the
      # lockfile v9 format is accepted without errors.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      # Install frontend deps before tauri-action runs so it doesn't fall back
      # to npm. The beforeBuildCommand ("pnpm build") in tauri.conf.json will
      # then compile the React bundle without needing a separate install step.
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # ── Python / PyInstaller backend sidecar ─────────────────────────────
      # Build the self-contained orbit-backend binary and rename it to include
      # the target triple so Tauri's externalBin lookup finds it at bundle time.
      # The .spec file lives in backend/ and references run.py as the entry point.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install backend dependencies (including PyInstaller)
        working-directory: backend
        run: ~/.local/bin/uv sync --all-groups

      - name: Build orbit-backend sidecar with PyInstaller
        working-directory: backend
        run: ~/.local/bin/uv run pyinstaller orbit-backend.spec --noconfirm

      # Tauri's externalBin looks for `orbit-backend-{target-triple}` next to
      # the binary defined in tauri.conf.json. On the macos-latest runner the
      # target is aarch64-apple-darwin.
      - name: Rename and sign sidecar binary
        run: |
          TARGET_TRIPLE=$(rustc -vV | grep '^host:' | awk '{print $2}')
          echo "Target triple: ${TARGET_TRIPLE}"
          ls -lh backend/dist/
          cp backend/dist/orbit-backend "backend/dist/orbit-backend-${TARGET_TRIPLE}"
          # PyInstaller --onefile ships with its own embedded signature which
          # conflicts with Tauri's codesign step during bundling. Strip it and
          # apply an ad-hoc signature so Tauri can re-sign cleanly.
          codesign --force --deep --sign - "backend/dist/orbit-backend-${TARGET_TRIPLE}"
          echo "Signed sidecar:"
          codesign -dv "backend/dist/orbit-backend-${TARGET_TRIPLE}"

      # ── Verify signing key ───────────────────────────────────────────────
      # TAURI_SIGNING_PRIVATE_KEY stores the raw .key file content
      # (the base64 blob from `cat ~/.tauri/orbit-signing-key.key`).
      # Tauri v2 natively accepts this format — no decoding needed.
      - name: Verify signing key is set
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "ERROR: TAURI_SIGNING_PRIVATE_KEY secret is empty"
            exit 1
          fi
          echo "Signing key is present (${#TAURI_SIGNING_PRIVATE_KEY} chars)"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # ── Build and release ─────────────────────────────────────────────────
      # tauri-apps/tauri-action@v0 is the stable major-version-pinned tag.
      # includeUpdaterJson: true uploads latest.json as a release asset so the
      # in-app updater can fetch it from the GitHub Release download URL.
      #
      # The source repo (this one) is private, so beta testers without
      # collaborator access can't download release assets from it — GitHub
      # doesn't support "public release assets on a private repo". Instead,
      # this publishes to Saadaan-Hassan/orbit-releases, a separate PUBLIC
      # repo that holds nothing but built .dmg downloads. owner/repo tell
      # tauri-action to target that repo; RELEASES_REPO_TOKEN must be a PAT
      # with write access to it (the default secrets.GITHUB_TOKEN only has
      # access to the repo running the workflow).
      - name: Build, sign, and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          # Raw base64 key content — Tauri v2 decodes this natively.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Vite bakes these into the frontend bundle at build time
          VITE_POSTHOG_PROJECT_KEY: ${{ secrets.VITE_POSTHOG_PROJECT_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_ENVIRONMENT: production
          VITE_APP_VERSION: ${{ github.ref_name }}
          # Baked into the sidecar binary at Rust compile time via option_env!()
          # Gemini and Voyage keys are NOT here — they live in Cloudflare Worker
          # secrets and are never exposed to the user's machine.
          WORKER_URL: ${{ secrets.WORKER_URL }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN_BACKEND: ${{ secrets.SENTRY_DSN_BACKEND }}

          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          # The Tauri project lives in app/, not the repo root.
          projectPath: ./app

          # tauriScript tells the action to invoke our local pnpm binary
          # instead of falling back to `npm run tauri`.
          tauriScript: pnpm tauri

          # Publish to the public releases-only companion repo, not this
          # (private) source repo. releaseCommitish must reference a ref
          # that exists in the TARGET repo — its main branch, not this one's.
          owner: Saadaan-Hassan
          repo: orbit-releases
          releaseCommitish: main

          # GitHub Release metadata — __VERSION__ is replaced by the action
          # with the version string from tauri.conf.json.
          tagName: ${{ github.ref_name }}
          releaseName: "Orbit v__VERSION__"
          releaseBody: |
            Download **Orbit.dmg** below to install on macOS 13+.
          releaseDraft: false
          prerelease: false

          # Upload latest.json as a GitHub Release asset.
          # The in-app updater fetches it from the permanent release download URL:
          #   github.com/Saadaan-Hassan/orbit-releases/releases/latest/download/latest.json
          includeUpdaterJson: true

          # false = write separate platform keys (darwin-aarch64, darwin-x86_64)
          # rather than collapsing everything into a single "universal" entry.
          updaterJsonKeepUniversal: false

      # Also publish a version-agnostic copy of the .dmg (e.g. Orbit-latest-
      # aarch64.dmg, no version number) alongside the versioned one tauri-
      # action already uploaded (e.g. Orbit_0.2.0_aarch64.dmg). This filename
      # is attached fresh to each new release, but the landing page links to
      # it via GitHub's .../releases/latest/download/<filename> pattern,
      # which always resolves to whatever release is currently marked
      # "Latest" — so the /beta page never needs updating after a new
      # release. --clobber only guards against a retried step re-uploading
      # within the same release.
      - name: Publish version-agnostic .dmg for stable download links
        run: |
          DMG_PATH=$(find app/src-tauri/target -name "*.dmg" -print -quit)
          if [ -z "$DMG_PATH" ]; then
            echo "ERROR: no .dmg found under app/src-tauri/target"
            exit 1
          fi
          echo "Found: $DMG_PATH"
          cp "$DMG_PATH" "Orbit-latest-${{ matrix.arch }}.dmg"
          gh release upload ${{ github.ref_name }} "Orbit-latest-${{ matrix.arch }}.dmg" \
            --repo Saadaan-Hassan/orbit-releases --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}

      # tauri-action just uploaded a latest.json containing ONLY this leg's
      # platform entry — the other matrix leg will overwrite that same-named
      # release asset with ITS single-platform version. Capture this leg's
      # copy now (before that happens) as a build artifact so the final
      # merge-latest-json job can combine both into one file with both
      # platform keys.
      - name: Capture this leg's latest.json before the other leg overwrites it
        run: |
          gh release download ${{ github.ref_name }} \
            --repo Saadaan-Hassan/orbit-releases \
            -p latest.json -O leg-latest-${{ matrix.arch }}.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}

      - name: Upload this leg's latest.json as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-${{ matrix.arch }}
          path: leg-latest-${{ matrix.arch }}.json

  # ---------------------------------------------------------------------------
  # Merge the two single-platform latest.json files (one per architecture)
  # into one file with both platform keys, then republish it as the release's
  # latest.json asset. Without this, the second matrix leg's upload silently
  # clobbers the first leg's platform entry and the updater would only ever
  # offer updates to whichever architecture built last.
  # ---------------------------------------------------------------------------
  merge-latest-json:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Download both platform latest.json artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: latest-json-*
          merge-multiple: true

      - name: Merge platform entries and republish latest.json
        run: |
          jq -s '.[0] * {platforms: (.[0].platforms + .[1].platforms)}' \
            leg-latest-aarch64.json leg-latest-x86_64.json > latest.json
          echo "Merged latest.json:"
          cat latest.json
          gh release upload ${{ github.ref_name }} latest.json \
            --repo Saadaan-Hassan/orbit-releases --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
