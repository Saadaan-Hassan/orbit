name: Release

# Triggered by pushing a version tag:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*"

# Allow the workflow to create GitHub Releases and commit the updater manifest.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Build a signed .dmg and publish it as a GitHub Release.
  #
  # tauri-apps/tauri-action handles three things in one step:
  #   1. Runs `pnpm tauri build` inside app/
  #   2. Creates (or updates) the GitHub Release and uploads .dmg + updater
  #      .tar.gz/.sig artefacts as release assets
  #   3. Writes releases/latest.json with the real version, signature, and
  #      download URL so the in-app auto-updater can find the new build
  #
  # The final step commits that updated manifest back to main so the file
  # served at the raw.githubusercontent.com updater endpoint is current.
  # ---------------------------------------------------------------------------
  build-and-release:
    runs-on: macos-latest   # Apple Silicon (M-series) runner

    steps:
      - uses: actions/checkout@v4

      # ── Rust ───────────────────────────────────────────────────────────────
      # dtolnay/rust-toolchain pins an explicit version and sets up caching
      # properly — more reliable than the pre-installed toolchain on the runner.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── Node + pnpm ────────────────────────────────────────────────────────
      # Pin pnpm to match the major version used locally (11.x) so the
      # lockfile v9 format is accepted without errors.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      # Install frontend deps before tauri-action runs so it doesn't fall back
      # to npm. The beforeBuildCommand ("pnpm build") in tauri.conf.json will
      # then compile the React bundle without needing a separate install step.
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # ── Build, release, and update manifest ───────────────────────────────
      # tauri-apps/tauri-action@v0 is the stable major-version-pinned tag.
      # It runs the Tauri build, creates the GitHub Release with the .dmg and
      # updater artefacts attached, then writes updaterJsonPath with the real
      # signature and download URL extracted from the built artefacts.
      - name: Build, sign, and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ed25519 signing key — store both secrets in:
          #   GitHub repo → Settings → Secrets and variables → Actions
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The Tauri project lives in app/, not the repo root.
          projectPath: ./app

          # tauriScript tells the action to invoke our local pnpm binary
          # instead of falling back to `npm run tauri`.
          tauriScript: pnpm tauri

          # GitHub Release metadata — __VERSION__ is replaced by the action
          # with the version string from tauri.conf.json.
          tagName: ${{ github.ref_name }}
          releaseName: "Orbit v__VERSION__"
          releaseBody: |
            Download **Orbit.dmg** below to install on macOS 13+.

            Full changelog: https://github.com/saadaanhassan/orbit/releases/tag/__VERSION__
          releaseDraft: false
          prerelease: false

          # Path (relative to repo root) where the action writes the updater
          # manifest. The in-app updater polls this file via raw.githubusercontent.com.
          # The action fills in the real version, signature, and asset URL.
          updaterJsonPath: ./releases/latest.json

          # false = write separate platform keys (darwin-aarch64, darwin-x86_64)
          # rather than collapsing everything into a single "universal" entry.
          updaterJsonKeepUniversal: false

      # ── Commit the refreshed updater manifest ─────────────────────────────
      # tauri-action wrote the new version/signature into releases/latest.json
      # on disk. Commit it so the raw.githubusercontent.com URL the in-app
      # updater polls always reflects the latest release.
      - name: Commit updated releases/latest.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/latest.json
          # Exit cleanly with no commit if the file didn't change
          # (e.g. a re-run of the same tag).
          git diff --cached --quiet && echo "No manifest changes to commit" && exit 0
          git commit -m "chore: update release manifest to ${{ github.ref_name }}"
          git push origin HEAD:main
